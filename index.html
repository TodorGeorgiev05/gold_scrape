<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gold Prices Plot</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

<h2>Gold Prices</h2>
<div id="chart" style="width: 100%; height: 600px;"></div>

<script>
// RAW CSV link from GitHub
const csvUrl = "https://raw.githubusercontent.com/TodorGeorgiev05/gold_scrape/main/gold_prices.csv";

// Fetch CSV
fetch(csvUrl)
    .then(response => response.text())
    .then(csvText => {
        const rows = csvText.trim().split("\n");

        // Parse header
        const header = rows[0].split(",");

        // Arrays
        let timestamps = [];
        let buy = [];
        let sell = [];
        let site = [];

        // Parse rows
        for (let i = 1; i < rows.length; i++) {
            const cols = rows[i].split(",");

            timestamps.push(cols[0]);
            site.push(cols[1]);
            buy.push(parseFloat(cols[2]));
            sell.push(parseFloat(cols[3]));
        }

        // Create Plotly trace for BUY
        const buyTrace = {
            x: timestamps,
            y: buy,
            mode: "lines+markers",
            name: "Buy Price",
            type: "scatter"
        };

        // Create Plotly trace for SELL
        const sellTrace = {
            x: timestamps,
            y: sell,
            mode: "lines+markers",
            name: "Sell Price",
            type: "scatter"
        };

        // Plot
        Plotly.newPlot("chart", [buyTrace, sellTrace], {
            title: "Gold Prices Over Time",
            xaxis: { title: "Time" },
            yaxis: { title: "Price (BGN)" }
        });
    })
    .catch(err => console.error("CSV load error:", err));
</script>

</body>
</html>

<script>
async function loadAndPlot() {
  const CSV_URL = "https://raw.githubusercontent.com/todorgeorgiev05/gold-scraper/main/gold_prices.csv"; // <- change to your real raw CSV URL;

  function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split("\t");

    return lines.slice(1).map(line => {
      const parts = line.split("\t");
      const row = {};
      headers.forEach((h, i) => row[h] = parts[i]);
      return row;
    });
  }

  function interpolateHourly(data) {
    const grouped = {};

    for (const row of data) {
      if (!grouped[row.site]) grouped[row.site] = [];

      grouped[row.site].push({
        t: new Date(Date.parse(row.timestamp)), // fixed
        buy: parseFloat(row.buy),
        sell: parseFloat(row.sell)
      });
    }

    const hourly = {};
    for (const site in grouped) {
      const arr = grouped[site].sort((a, b) => a.t - b.t);

      const start = new Date(arr[0].t);
      start.setMinutes(0, 0, 0);

      const end = new Date(arr[arr.length - 1].t);
      end.setMinutes(0, 0, 0);

      const result = [];

      for (let t = new Date(start); t <= end; t = new Date(t.getTime() + 3600000)) {
        let before = null, after = null;

        for (const p of arr) {
          if (p.t <= t) before = p;
          if (!after && p.t >= t) after = p;
        }

        if (before && after) {
          if (before.t.getTime() === after.t.getTime()) {
            result.push({ t, buy: before.buy, sell: before.sell });
          } else {
            const r = (t - before.t) / (after.t - before.t);
            result.push({
              t,
              buy: before.buy + (after.buy - before.buy) * r,
              sell: before.sell + (after.sell - before.sell) * r
            });
          }
        }
      }

      hourly[site] = result;
    }

    return hourly;
  }

  const raw = await fetch(CSV_URL).then(r => r.text());
  const data = parseCSV(raw);
  const hourly = interpolateHourly(data);

  const traces = [];
  for (const site in hourly) {
    traces.push({
      x: hourly[site].map(p => p.t),
      y: hourly[site].map(p => p.buy),
      mode: "lines+markers",
      name: `${site} buy`
    });
    traces.push({
      x: hourly[site].map(p => p.t),
      y: hourly[site].map(p => p.sell),
      mode: "lines+markers",
      name: `${site} sell`
    });
  }

  Plotly.newPlot("plot", traces, {
    title: "Gold Prices (Hourly Interpolated)",
    xaxis: { title: "Time" },
    yaxis: { title: "Price" },
    hovermode: "x unified"
  });
}

loadAndPlot();
</script>

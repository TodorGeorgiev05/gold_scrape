<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Currency</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<header>
  <h2>Currency</h2>
  <a href="./index.html">Home</a>
</header>

<div class="card">
  <h3>Converter (Live)</h3>

  <!-- reuse the same inputs look, but without the centered card styling -->
  <div class="fx-form">
    <input id="amount" type="number" value="100" />

    <select id="from"></select>
    <select id="to"></select>

    <div class="fx-actions">
      <button class="primary" type="button" id="swapBtn">Swap</button>
      <button class="primary" type="button" id="convertBtn">Convert</button>
    </div>

    <div class="result" id="result">—</div>
    <p class="muted" id="rateInfo"></p>
  </div>
</div>

<div class="card">
  <h3>EUR Exchange Rate (Last 30 Days)</h3>

  <label class="muted" for="pairSelect">Choose pair</label><br>
  <select id="pairSelect">
    <option value="USD">EUR -> USD</option>
    <option value="GBP">EUR -> GBP</option>
    <option value="CZK">EUR -> CZK</option>
  </select>

  <p class="muted" id="chartInfo">Loading chart…</p>
  <canvas id="fxChart" height="120"></canvas>
</div>

<script>
const API_LATEST = "https://api.frankfurter.dev/v1/latest";
const API_RANGE  = "https://api.frankfurter.dev/v1";
const BGN_PER_EUR = 1.95583; // fixed peg

let rates = null;      // all rates relative to EUR
let ratesDate = null;
let chart = null;

const $amount = document.getElementById("amount");
const $from = document.getElementById("from");
const $to = document.getElementById("to");
const $result = document.getElementById("result");
const $rateInfo = document.getElementById("rateInfo");

const $pair = document.getElementById("pairSelect");
const $chartInfo = document.getElementById("chartInfo");

document.getElementById("convertBtn").addEventListener("click", convert);
document.getElementById("swapBtn").addEventListener("click", swap);
$pair.addEventListener("change", () => loadChartLast30($pair.value));

boot();

async function boot() {
  await loadRates();

  fillDropdowns();

  // defaults
  $from.value = "BGN";
  $to.value = "EUR";
  convert();

  $pair.value = "USD";
  loadChartLast30("USD");
}

async function loadRates() {
  // Keep base=EUR so the math stays simple everywhere
  const res = await fetch(`${API_LATEST}?base=EUR`, { cache: "no-store" });
  if (!res.ok) throw new Error("Could not load FX rates");

  const data = await res.json();
  ratesDate = data.date;

  // Frankfurter doesn't include the base in "rates"
  rates = { ...data.rates, EUR: 1 };

  // Frankfurter doesn't provide BGN (peg), so we add it
  rates.BGN = BGN_PER_EUR;
}

function fillDropdowns() {
  const codes = Object.keys(rates).sort();

  $from.innerHTML = "";
  $to.innerHTML = "";

  for (const c of codes) {
    $from.add(new Option(c, c));
    $to.add(new Option(c, c));
  }
}

function swap() {
  const tmp = $from.value;
  $from.value = $to.value;
  $to.value = tmp;
  convert();
}

function convert() {
  if (!rates) return;

  const amount = Number($amount.value);
  if (!Number.isFinite(amount)) {
    $result.textContent = "Enter amount";
    return;
  }

  const from = $from.value;
  const to = $to.value;

  // Convert "from" -> EUR -> "to"
  // rates[currency] means: 1 EUR = rates[currency] currency
  let eur;
  if (from === "EUR") eur = amount;
  else eur = amount / rates[from];

  let out;
  if (to === "EUR") out = eur;
  else out = eur * rates[to];

  $result.textContent = out.toFixed(2) + " " + to;
  $rateInfo.textContent = `Rates date: ${ratesDate} • Source: Frankfurter `;
}

async function loadChartLast30(symbol) {
  const end = new Date();
  const start = new Date(end);
  start.setDate(start.getDate() - 30);

  const url = `${API_RANGE}/${fmt(start)}..${fmt(end)}?base=EUR&symbols=${encodeURIComponent(symbol)}`;

  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) {
    $chartInfo.textContent = "Failed to load chart data.";
    return;
  }

  const data = await res.json();

  const points = Object.entries(data.rates)
    .map(([date, obj]) => ({ date, value: obj[symbol] }))
    .sort((a, b) => a.date.localeCompare(b.date));

  if (!points.length) {
    $chartInfo.textContent = "No chart data returned.";
    return;
  }

  $chartInfo.textContent = `EUR -> ${symbol} • last 30 days`;

  const labels = points.map(p =>
    new Date(p.date).toLocaleDateString("bg-BG", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    })
  );


  const values = points.map(p => p.value);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("fxChart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: `EUR -> ${symbol}`,
        data: values,
        tension: 0.25
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: true } }
    }
  });
}

function fmt(d) {
  return d.toISOString().slice(0, 10);
}
</script>
</body>
</html>

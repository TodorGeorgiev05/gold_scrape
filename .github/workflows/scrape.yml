name: Gold Scraper

on:
  schedule:
    - cron: "*/1 * * * *"  # every 1 minutes UTC
  workflow_dispatch:       

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape_all.py

      - name: Commit and push CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gold_prices.csv
          git commit -m "Update gold_prices.csv [skip ci]" || echo "No changes to commit"
          git push https://$GITHUB_TOKEN@github.com/TodorGeorgiev05/gold_scrape.git HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

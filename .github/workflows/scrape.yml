name: Gold Price Scraper

on:
  schedule:
    - cron: "0 6,8,10,12,14,16,18 * * *"     # 08,10,12,14,16,18,20 local time
    - cron: "22 15 * * *"                    # 17:20 local time
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraping scripts
        run: |
          python tavex1.py
          python tavex100.py
          python zlaten.py
          python topgold.py

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v3
        with:
          name: gold-prices
          path: gold_prices.csv

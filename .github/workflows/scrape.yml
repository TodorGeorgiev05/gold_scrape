name: Gold Scraper

on:
  schedule:
    - cron: "0 8,10,12,14,16,18,20 * * *" # Runs at 08:00, 10:00, ..., 20:00 UTC
    - cron: "20 17 * * *" 
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_all.py

      - name: Commit CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gold_prices.csv
          git commit -m "Update gold prices"
          git push

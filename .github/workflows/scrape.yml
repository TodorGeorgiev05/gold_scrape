name: Gold Price Scraper

on:
  schedule:
    - cron: "0 6,8,10,12,14,16,18 * * *"     # 08,10,12,14,16,18,20 local time
    - cron: "28 15 * * *"                    # 17:28 local time
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape_all.py

      - name: Commit and push CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gold_prices.csv
          git commit -m "Update gold_prices.csv [skip ci]" || echo "No changes to commit"
          git push
